# diwan-template-block_credential_in_response.yaml
# ----------------------------------------------------------------------------
# Lobster Trap policy template — Diwan-suggested.
#
# Shape:
#   - Egress DENY when the model output emits an API key / private key /
#     bearer token / env-var-shaped secret. Catches the LLM02 leak path
#     where credentials in system prompt or RAG context are echoed back.
#
# Covers attacks: exfil-env-vars-via-webhook, markdown-image-beacon-stripe-key,
# indirect-injection-echoleak (egress half).
#
# OWASP: LLM02.
#
# Placeholders: NONE — uses the inspector's CredentialPatterns directly.
# ----------------------------------------------------------------------------

version: "1.0"
policy_name: "diwan-template-block_credential_in_response"
default_action: ALLOW

egress_rules:
  - name: block_egress_credential_leak_{{run_id}}
    description: "[DIWAN-SUGGESTED] Model output contains credential material (LLM02)"
    priority: 95
    action: DENY
    deny_message: "[DIWAN-SUGGESTED] Output blocked: credential leak."
    conditions:
      - field: contains_credentials
        match_type: boolean
        value: true
