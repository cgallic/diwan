# diwan-template-block_credential_in_prompt.yaml
# ----------------------------------------------------------------------------
# Lobster Trap policy template — Diwan-suggested.
#
# Shape:
#   - Ingress DENY when the prompt body contains credential material
#     (env-var-shaped pasting, API keys, AWS/GitHub/OpenAI/Stripe key
#     prefixes, JWTs, BEGIN PRIVATE KEY blocks).
#   - Defends against the "agent reads its env / board secret artifact and
#     pastes it into a tool-call prompt" surface.
#
# Covers attacks: exfil-env-vars-via-webhook (specialized rule alongside
# block_external_exfiltration), exfil-dns-tunnel-beacon, indirect-injection-echoleak.
#
# OWASP: LLM02.
#
# Placeholders: NONE — uses the inspector's CredentialPatterns directly.
# ----------------------------------------------------------------------------

version: "1.0"
policy_name: "diwan-template-block_credential_in_prompt"
default_action: ALLOW

ingress_rules:
  - name: block_credential_in_prompt_{{run_id}}
    description: "[DIWAN-SUGGESTED] Credential material in prompt body (LLM02)"
    priority: 92
    action: DENY
    deny_message: "[DIWAN-SUGGESTED] Blocked: credential material in prompt body."
    conditions:
      - field: contains_credentials
        match_type: boolean
        value: true

  - name: log_credential_intent_{{run_id}}
    description: "[DIWAN-SUGGESTED] Log credential_access intent for replay UI"
    priority: 30
    action: LOG
    conditions:
      - field: intent_category
        match_type: exact
        value: "credential_access"
